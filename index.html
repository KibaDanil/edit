<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Технология разработки ПО — интерактивный курс</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh; padding: 20px; color: #2d3748;
    -webkit-user-select: none; -ms-user-select: none; user-select: none;
  }
  .container { max-width: 820px; margin: 0 auto; }
  .card {
    background: white; border-radius: 16px; padding: 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3); margin-bottom: 20px;
  }
  h1 { font-size: 26px; margin-bottom: 8px; color: #1a202c; line-height: 1.3; }
  h2 { font-size: 21px; margin-bottom: 14px; color: #2d3748; }
  h3 { font-size: 17px; margin-bottom: 10px; color: #4a5568; }
  .subtitle { color: #718096; margin-bottom: 22px; font-size: 15px; line-height: 1.6; }
  .progress-bar { height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; margin-bottom: 24px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); transition: width 0.4s ease; }
  .theory {
    background: #f7fafc; border-left: 4px solid #667eea; padding: 20px;
    border-radius: 8px; margin-bottom: 20px; line-height: 1.75; font-size: 15px;
  }
  .theory p { margin-bottom: 10px; }
  .theory p:last-child { margin-bottom: 0; }
  .theory ul, .theory ol { margin: 8px 0 10px 22px; }
  .theory li { margin-bottom: 6px; }
  .theory code {
    background: #edf2f7; padding: 2px 6px; border-radius: 4px;
    font-family: 'Courier New', monospace; color: #c53030; font-size: 14px;
  }
  .theory pre {
    background: #1a202c; color: #e2e8f0; padding: 16px; border-radius: 8px;
    overflow-x: auto; margin: 12px 0;
    font-family: 'Courier New', monospace; font-size: 14px; line-height: 1.55;
  }
  .theory pre code { background: none; color: inherit; padding: 0; }
  .tag {
    display: inline-block; background: #667eea; color: white;
    padding: 4px 12px; border-radius: 20px; font-size: 11px;
    font-weight: 700; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.6px;
  }
  .tag.model { background: #38a169; }
  .tag.web { background: #3182ce; }
  .tag.db { background: #dd6b20; }
  .tag.dev { background: #805ad5; }
  input[type="text"] {
    width: 100%; padding: 14px 16px; font-size: 16px;
    border: 2px solid #e2e8f0; border-radius: 10px;
    outline: none; transition: border-color 0.2s; font-family: inherit;
    -webkit-user-select: text; user-select: text;
  }
  input[type="text"]:focus { border-color: #667eea; }
  /* ====== ВАРИАНТЫ ВЫБОРА ====== */
  .option {
    display: block; padding: 14px 18px; border: 2px solid #e2e8f0;
    border-radius: 10px; margin-bottom: 10px; cursor: pointer;
    transition: all 0.2s; font-size: 15px; line-height: 1.5;
  }
  .option:hover { border-color: #667eea; background: #f7fafc; }
  .option.selected { border-color: #667eea; background: #ebf4ff; }
  .option.correct { border-color: #48bb78; background: #f0fff4; }
  .option.wrong { border-color: #f56565; background: #fff5f5; }
  .option.locked { cursor: default; }
  .option.locked:hover { background: inherit; border-color: inherit; }
  .option.locked.correct:hover { background: #f0fff4; border-color: #48bb78; }
  .option.locked.wrong:hover { background: #fff5f5; border-color: #f56565; }
  .option .check {
    display: inline-block; width: 22px; height: 22px;
    border: 2px solid #cbd5e0; border-radius: 5px;
    margin-right: 10px; vertical-align: middle;
    text-align: center; line-height: 18px; font-size: 14px;
    color: transparent; transition: all 0.2s;
  }
  .option.selected .check { background: #667eea; border-color: #667eea; color: white; }
  .option.correct .check { background: #48bb78; border-color: #48bb78; color: white; }
  .option.wrong .check { background: #f56565; border-color: #f56565; color: white; }
  /* ====== ПОРЯДОК ====== */
  .order-pool, .order-chain {
    display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px;
    min-height: 50px; padding: 10px; border-radius: 10px;
    background: #f7fafc; border: 2px dashed #e2e8f0;
  }
  .order-chain { background: #ebf4ff; border-color: #c3dafe; }
  .order-chain:empty::before {
    content: 'Кликайте элементы ниже в правильном порядке';
    color: #a0aec0; font-size: 14px; padding: 10px;
  }
  .order-item {
    padding: 10px 16px; background: white; border: 2px solid #cbd5e0;
    border-radius: 8px; cursor: pointer; font-size: 14px;
    transition: all 0.2s; display: flex; align-items: center; gap: 8px;
  }
  .order-item:hover { border-color: #667eea; color: #667eea; }
  .order-item.in-chain {
    background: #667eea; color: white; border-color: #667eea;
    cursor: default;
  }
  .order-item .num {
    display: inline-block; width: 22px; height: 22px;
    background: rgba(255,255,255,0.3); border-radius: 50%;
    text-align: center; line-height: 22px; font-size: 12px; font-weight: 700;
  }
  .order-item.correct-chain { background: #48bb78; border-color: #48bb78; }
  .order-item.wrong-chain { background: #f56565; border-color: #f56565; }
  /* ====== СОПОСТАВЛЕНИЕ ====== */
  .match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 600px) { .match-grid { grid-template-columns: 1fr; } }
  .match-col { display: flex; flex-direction: column; gap: 8px; }
  .match-item {
    padding: 12px 16px; background: white; border: 2px solid #cbd5e0;
    border-radius: 10px; cursor: pointer; font-size: 14px;
    transition: all 0.2s; line-height: 1.4;
  }
  .match-item:hover:not(.matched) { border-color: #667eea; }
  .match-item.active { border-color: #667eea; background: #ebf4ff; box-shadow: 0 0 0 3px rgba(102,126,234,0.2); }
  .match-item.matched { cursor: default; color: #4a5568; }
  .match-item.correct-match { background: #f0fff4; border-color: #48bb78; }
  .match-item.wrong-match { background: #fff5f5; border-color: #f56565; }
  .match-item .pair-label {
    display: inline-block; width: 22px; height: 22px;
    background: #667eea; color: white; border-radius: 50%;
    text-align: center; line-height: 22px; font-size: 12px;
    font-weight: 700; margin-right: 8px;
  }
  .match-item.correct-match .pair-label { background: #48bb78; }
  .match-item.wrong-match .pair-label { background: #f56565; }
  /* ====== КНОПКИ ====== */
  .btn {
    padding: 14px 28px; font-size: 16px; font-weight: 600; border: none;
    border-radius: 10px; cursor: pointer; transition: all 0.2s;
    font-family: inherit;
    background: linear-gradient(135deg, #667eea, #764ba2); color: white;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(102,126,234,0.4); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-secondary { background: #e2e8f0; color: #4a5568; }
  .btn-secondary:hover { box-shadow: 0 6px 20px rgba(0,0,0,0.1); }
  .actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 22px; flex-wrap: wrap; }
  .actions.space-between { justify-content: space-between; }
  .feedback {
    padding: 16px 18px; border-radius: 10px; margin-top: 16px;
    font-size: 14.5px; line-height: 1.65; display: none;
  }
  .feedback.show { display: block; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  .feedback.success { background: #f0fff4; border-left: 4px solid #48bb78; color: #276749; }
  .feedback.error { background: #fff5f5; border-left: 4px solid #f56565; color: #c53030; }
  .feedback.partial { background: #fffaf0; border-left: 4px solid #ed8936; color: #975a16; }
  .feedback .fb-title { font-weight: 700; margin-bottom: 6px; display: block; }
  /* ====== РЕЗУЛЬТАТЫ ====== */
  .results-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; margin: 24px 0; }
  .stat { background: #f7fafc; padding: 20px; border-radius: 12px; text-align: center; }
  .stat-value { font-size: 32px; font-weight: 700; color: #667eea; }
  .stat-label { font-size: 13px; color: #718096; margin-top: 4px; }
  .review-item { padding: 16px 18px; border-radius: 10px; margin-bottom: 12px; background: #f7fafc; line-height: 1.6; }
  .review-item.correct-item { border-left: 4px solid #48bb78; }
  .review-item.wrong-item { border-left: 4px solid #f56565; }
  .review-question { font-weight: 600; margin-bottom: 8px; font-size: 15px; }
  .review-explain { margin-top: 8px; padding-top: 8px; border-top: 1px dashed #cbd5e0; font-size: 13.5px; color: #4a5568; font-style: italic; }
  .hidden { display: none !important; }
  .name-badge {
    display: inline-block; background: #ebf4ff; color: #667eea;
    padding: 6px 14px; border-radius: 20px; font-size: 14px;
    font-weight: 600; margin-bottom: 16px;
  }
  .score-big { text-align: center; padding: 28px; }
  .score-big .value {
    font-size: 72px; font-weight: 800;
    background: linear-gradient(135deg, #667eea, #764ba2);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .score-big .label { font-size: 18px; color: #718096; margin-top: 8px; }
  .module-meta { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }
  .module-counter { font-size: 13px; color: #a0aec0; font-weight: 600; }
  .start-intro { background: #f7fafc; border-radius: 12px; padding: 20px; margin-bottom: 22px; line-height: 1.7; font-size: 15px; color: #4a5568; }
  .start-intro ul { margin: 10px 0 0 22px; }
  .start-intro li { margin-bottom: 6px; }
  .step-label { display: inline-block; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: #a0aec0; margin-bottom: 14px; }
  /* кнопка "Назад" */
  .btn-back {
    background: transparent; color: #667eea; border: 2px solid #c3dafe;
    padding: 12px 22px; font-size: 15px;
  }
  .btn-back:hover { background: #ebf4ff; box-shadow: none; transform: translateY(-1px); }
</style>
</head>
<body>
<div class="container" id="app"></div>
<script>
const LESSONS = [
  // ===== 1. ПОРЯДОК: этапы создания ПО (с подробным описанием) =====
  {
    tag: 'Разработка ПО', tagClass: 'dev',
    theory: `<h3>Что такое программное обеспечение</h3>
      <p><b>Программа</b> — это набор инструкций, которые компьютер выполняет, чтобы решить задачу пользователя. <b>Программное обеспечение (ПО)</b> — совокупность всех программ и данных.</p>
      <p>Любая программа проходит путь от идеи до эксплуатации. Пропустить этап нельзя: если не протестировать — пользователи получат «сырой» продукт, если не спроектировать — код будет хаотичным.</p>
      <h3>Этапы создания ПО (подробно)</h3>
      <ol>
        <li><b>Идея</b> — понимание, зачем нужна программа, какую проблему она решает и для кого создаётся. На этом этапе формулируется замысел: «нужен сервис для записи к врачу», «нужна программа для учёта оценок». Без чёткой идеи остальные этапы теряют смысл.</li>
        <li><b>Анализ требований</b> — сбор и документирование того, что программа должна делать. Общаемся с заказчиком и пользователями, выясняем функции (что делать) и ограничения (скорость, безопасность, совместимость). Результат — список требований, по которому потом будут проверять готовый продукт.</li>
        <li><b>Проектирование</b> — решение, как программа будет устроена внутри: архитектура, модули, структура данных, взаимодействие с базой данных, интерфейс. На этом этапе рисуются схемы и принимаются ключевые технические решения, чтобы разработка не превратилась в хаос.</li>
        <li><b>Разработка (код)</b> — написание программного кода по проекту. Программисты реализуют функции, описанные в требованиях, и собирают программу из модулей. Это самый объёмный по времени этап.</li>
        <li><b>Тестирование</b> — проверка, что программа работает правильно и соответствует требованиям. Ищутся ошибки (баги), проверяются граничные случаи, удобство и безопасность. Без этого этапа пользователи получат «сырой» продукт.</li>
        <li><b>Эксплуатация</b> — передача программы пользователям, установка, обучение, поддержка и обновления. После запуска собираются отзывы и исправляются найденные проблемы. При необходимости цикл повторяется — выпускаются новые версии.</li>
      </ol>
      <p>Это и есть путь программы: <b>идея → анализ требований → проектирование → разработка → тестирование → эксплуатация</b>.</p>`,
    type: 'order',
    question: 'Расставь этапы создания программы по порядку. Кликайте элементы в правильной последовательности.',
    items: ['Идея', 'Анализ требований', 'Проектирование', 'Разработка (код)', 'Тестирование', 'Эксплуатация'],
    correctOrder: [0, 1, 2, 3, 4, 5],
    explanation: 'Это классический путь: сначала понимаем, что нужно (идея, анализ), потом решаем, как это сделать (проектирование), пишем код (разработка), проверяем (тестирование) и только потом отдаём пользователям (эксплуатация).'
  },
  // ===== 2. ВЫБОР: Agile =====
  {
    tag: 'Разработка ПО', tagClass: 'dev',
    theory: `<h3>Жизненный цикл ПО (SDLC)</h3>
      <p><b>SDLC</b> (Software Development Life Cycle) — цикл жизни программы. Две главные модели:</p>
      <ul>
        <li><b>Водопадная</b> — этапы строго по порядку. Подходит, когда требования стабильны (госзаказ, драйверы).</li>
        <li><b>Agile (гибкая)</b> — короткими итерациями, с постоянной обратной связью. Подходит, когда требования могут меняться (стартапы, новые сервисы).</li>
      </ul>
      <p><b>Итерация</b> — короткий цикл: сделали кусочек → показали → получили отзыв → улучшили.</p>`,
    type: 'single',
    question: 'Для какого проекта лучше подойдёт Agile?',
    options: [
      'Обновление банковской системы по государственному регламенту',
      'Новый мобильный сервис, идея которого ещё проверяется',
      'Драйвер для принтера'
    ],
    correct: 1,
    explanation: 'Agile выбирают, когда требования могут меняться. В банковском госзаказе и драйверах требования зафиксированы заранее — там удобнее водопадная модель.'
  },
  // ===== 3. СОПОСТАВЛЕНИЕ: роли =====
  {
    tag: 'Разработка ПО', tagClass: 'dev',
    theory: `<h3>Роли в команде разработки</h3>
      <p>В команде у каждого своя зона ответственности:</p>
      <ul>
        <li><b>Аналитик</b> — переводит задачу с языка бизнеса на язык требований. Отвечает на вопрос «что должно быть».</li>
        <li><b>Архитектор</b> — решает, как программа устроена внутри.</li>
        <li><b>Разработчик</b> — пишет код.</li>
        <li><b>Тестировщик</b> — проверяет, что всё работает по требованиям.</li>
        <li><b>DevOps</b> — отвечает за запуск и эксплуатацию.</li>
      </ul>
      <p>Важно не путать «что» (аналитик) и «как» (архитектор и разработчик).</p>`,
    type: 'match',
    question: 'Сопоставь роль и то, чем она занимается. Кликните слева, затем справа, чтобы образовать пару.',
    left: ['Аналитик', 'Архитектор', 'Разработчик', 'Тестировщик', 'DevOps'],
    right: [
      'Описывает требования: что должно быть',
      'Решает, как программа устроена внутри',
      'Пишет код',
      'Проверяет, что всё работает по требованиям',
      'Отвечает за запуск и эксплуатацию'
    ],
    explanation: 'Аналитик фиксирует «что», архитектор проектирует «как», разработчик реализует, тестировщик проверяет, DevOps запускает. Это разные роли, даже если иногда их совмещает один человек в маленькой команде.'
  },
  // ===== 4. МНОЖЕСТВЕННЫЙ: нефункциональные требования =====
  {
    tag: 'Разработка ПО', tagClass: 'dev',
    theory: `<h3>Требования: функциональные и нефункциональные</h3>
      <p><b>Функциональные требования</b> — что программа делает: «можно добавить студента», «показать расписание».</p>
      <p><b>Нефункциональные требования</b> — какая она должна быть: «работает за 0.5 секунды», «доступна 99.9% времени», «защищена паролем».</p>
      <p>Новички часто описывают только функциональные — это ошибка. Без нефункциональных требований программа может работать, но быть медленной или уязвимой.</p>`,
    type: 'multi',
    question: 'Отметь ВСЕ нефункциональные требования (можно выбрать несколько).',
    options: [
      'Пользователь может восстановить пароль',
      'Сайт открывается за 1 секунду',
      'Есть кнопка «Выход»',
      'Система доступна 99.9% времени',
      'Можно добавить студента в группу'
    ],
    correctSet: [1, 3],
    explanation: 'Нефункциональные требования — про качество работы (скорость, надёжность, безопасность), а не про конкретные функции. «Открывается за 1 секунду» и «доступна 99.9% времени» — это качество.'
  },
  // ===== 5. МНОЖЕСТВЕННЫЙ: плюсы десктопа =====
  {
    tag: 'Десктоп', tagClass: 'web',
    theory: `<h3>Что такое десктопное приложение</h3>
      <p><b>Десктопное</b> приложение устанавливается <b>на компьютер пользователя</b> (Windows, macOS, Linux).</p>
      <p>Примеры: Word, Excel, Photoshop, Telegram Desktop, VS Code.</p>
      <p><b>Плюсы:</b> работает без интернета, использует все ресурсы компьютера, быстрый отклик, доступ к файлам напрямую.</p>
      <p><b>Минусы:</b> нужно устанавливать на каждый компьютер, обновлять вручную, разные версии для разных ОС.</p>`,
    type: 'multi',
    question: 'Отметь ВСЕ плюсы десктопного приложения.',
    options: [
      'Работает без интернета',
      'Ничего не нужно устанавливать',
      'Использует все ресурсы компьютера',
      'Обновления приходят сразу всем пользователям',
      'Быстрый отклик интерфейса'
    ],
    correctSet: [0, 2, 4],
    explanation: 'Плюсы десктопа — независимость от сети, доступ к ресурсам ПК и быстрый интерфейс. Установка нужна — это минус. Мгновенные обновления для всех — плюс веба.'
  },
  // ===== 6. МНОЖЕСТВЕННЫЙ: минусы веба =====
  {
    tag: 'Веб', tagClass: 'web',
    theory: `<h3>Что такое веб-приложение</h3>
      <p><b>Веб-приложение</b> работает <b>в браузере</b>. Пользователь открывает ссылку и сразу пользуется.</p>

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('copy', e => {
  const tag = e.target.tagName;
  if (tag !== 'INPUT' && tag !== 'TEXTAREA') e.preventDefault();
});
document.addEventListener('cut', e => {
  const tag = e.target.tagName;
  if (tag !== 'INPUT' && tag !== 'TEXTAREA') e.preventDefault();
});
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && ['c','x','a'].includes(e.key.toLowerCase())) {
    const tag = e.target.tagName;
    if (tag !== 'INPUT' && tag !== 'TEXTAREA') e.preventDefault();
  }
});

const state = { studentName: '', currentIndex: 0, answers: [] };
const app = document.getElementById('app');

function escapeHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function shuffle(arr) {
  const a = arr.map((v, i) => ({ v, i }));
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ============================================================
//  СТАРТ
// ============================================================
function renderStart() {
  app.innerHTML = `
    <div class="card">
      <h1>💻 Технология разработки ПО</h1>
      <p class="subtitle">Интерактивный курс: Технология разработки ПО</p>
      <div class="start-intro">
        <b></b>
      </div>
      <input type="text" id="nameInput" placeholder="Ваше имя" maxlength="40" autocomplete="off">
      <div class="actions">
        <button class="btn" id="startBtn">Начать обучение →</button>
      </div>
    </div>`;
  const input = document.getElementById('nameInput');
  const btn = document.getElementById('startBtn');
  input.focus();
  input.addEventListener('keydown', e => { if (e.key === 'Enter') btn.click(); });
  btn.addEventListener('click', () => {
    const name = input.value.trim();
    if (name.length < 2) {
      input.style.borderColor = '#f56565';
      input.placeholder = 'Введите имя (минимум 2 символа)';
      return;
    }
    state.studentName = name;
    state.currentIndex = 0;
    state.answers = [];
    renderTheory();
  });
}

// ============================================================
//  СТРАНИЦА 1: ТЕОРИЯ
// ============================================================
function renderTheory() {
  if (state.currentIndex >= LESSONS.length) { renderFinalTest(); return; }
  const lesson = LESSONS[state.currentIndex];
  const progress = (state.currentIndex / (LESSONS.length + 1)) * 100;

  app.innerHTML = `
    <div class="card">
      <div class="module-meta">
        <span class="name-badge">👤 ${escapeHtml(state.studentName)}</span>
        <span class="module-counter">Модуль ${state.currentIndex + 1} из ${LESSONS.length}</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
      <span class="step-label">Шаг 1 — Теория</span>
      <span class="tag ${lesson.tagClass}">${lesson.tag}</span>
      <div class="theory">${lesson.theory}</div>
      <div class="actions space-between">
        <button class="btn btn-back" id="backBtn">← Назад</button>
        <button class="btn" id="toTaskBtn">Перейти к заданию →</button>
      </div>
    </div>`;

  document.getElementById('toTaskBtn').addEventListener('click', renderTask);

  document.getElementById('backBtn').addEventListener('click', () => {
    if (state.currentIndex === 0) {
      // С первого модуля — на стартовый экран
      state.studentName = '';
      state.currentIndex = 0;
      state.answers = [];
      renderStart();
    } else {
      state.currentIndex--;
      renderTask();
    }
  });

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ============================================================
//  СТРАНИЦА 2: ЗАДАНИЕ (по типу)
// ============================================================
function renderTask() {
  const lesson = LESSONS[state.currentIndex];
  const progress = (state.currentIndex / (LESSONS.length + 1)) * 100;

  app.innerHTML = `
    <div class="card">
      <div class="module-meta">
        <span class="name-badge">👤 ${escapeHtml(state.studentName)}</span>
        <span class="module-counter">Модуль ${state.currentIndex + 1} из ${LESSONS.length}</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
      <span class="step-label">Шаг 2 — Задание</span>
      <span class="tag ${lesson.tagClass}">${lesson.tag}</span>
      <h2>Проверьте себя</h2>
      <p style="color:#4a5568; margin-bottom:16px; font-size:15px; line-height:1.6;">${escapeHtml(lesson.question)}</p>
      <div id="taskArea"></div>
      <div class="feedback" id="feedback"></div>
      <div class="actions space-between">
        <button class="btn btn-back" id="backBtn">← Назад</button>
        <div style="display:flex; gap:12px; flex-wrap:wrap;">
          <button class="btn" id="checkBtn" disabled>Проверить</button>
          <button class="btn btn-secondary hidden" id="nextBtn">
            ${state.currentIndex + 1 === LESSONS.length ? 'К итоговому тесту →' : 'Далее →'}
          </button>
        </div>
      </div>
    </div>`;

  const taskArea = document.getElementById('taskArea');
  const checkBtn = document.getElementById('checkBtn');
  const nextBtn = document.getElementById('nextBtn');
  const feedback = document.getElementById('feedback');

  document.getElementById('backBtn').addEventListener('click', () => {
    // Назад со страницы задания — всегда к теории текущего модуля
    // (для первого модуля это тоже корректно: вернёт к теории 1-го модуля)
    renderTheory();
  });

  let checkFn;
  if (lesson.type === 'single') checkFn = setupSingle(lesson, taskArea, checkBtn);
  else if (lesson.type === 'multi') checkFn = setupMulti(lesson, taskArea, checkBtn);
  else if (lesson.type === 'order') checkFn = setupOrder(lesson, taskArea, checkBtn);
  else if (lesson.type === 'match') checkFn = setupMatch(lesson, taskArea, checkBtn);

  checkBtn.addEventListener('click', () => {
    const result = checkFn();
    state.answers.push({ lessonIndex: state.currentIndex, result });
    showFeedback(feedback, result, lesson);
    checkBtn.classList.add('hidden');
    nextBtn.classList.remove('hidden');
    nextBtn.focus();
  });

  nextBtn.addEventListener('click', () => {
    state.currentIndex++;
    renderTheory();
  });

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ============================================================
//  ТИП 1: ВЫБОР ОДНОГО
// ============================================================
function setupSingle(lesson, taskArea, checkBtn) {
  let selected = null;
  let locked = false;
  taskArea.innerHTML = lesson.options.map((opt, i) =>
    `<label class="option" data-index="${i}">${escapeHtml(opt)}</label>`
  ).join('');

  const options = taskArea.querySelectorAll('.option');
  options.forEach(opt => {
    opt.addEventListener('click', () => {
      if (locked) return;
      options.forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
      selected = parseInt(opt.dataset.index);
      checkBtn.disabled = false;
    });
  });

  return () => {
    locked = true;
    const correct = selected === lesson.correct;
    options.forEach((opt, i) => {
      opt.classList.add('locked');
      if (i === lesson.correct) opt.classList.add('correct');
      else if (i === selected) opt.classList.add('wrong');
    });
    return { correct, detail: correct ? '' : `Правильный ответ: ${lesson.options[lesson.correct]}` };
  };
}

// ============================================================
//  ТИП 2: МНОЖЕСТВЕННЫЙ ВЫБОР
// ============================================================
function setupMulti(lesson, taskArea, checkBtn) {
  let selected = new Set();
  let locked = false;
  taskArea.innerHTML = lesson.options.map((opt, i) =>
    `<label class="option" data-index="${i}"><span class="check"></span>${escapeHtml(opt)}</label>`
  ).join('');

  const options = taskArea.querySelectorAll('.option');
  options.forEach(opt => {
    opt.addEventListener('click', () => {
      if (locked) return;
      const i = parseInt(opt.dataset.index);
      if (selected.has(i)) { selected.delete(i); opt.classList.remove('selected'); }
      else { selected.add(i); opt.classList.add('selected'); }
      checkBtn.disabled = selected.size === 0;
    });
  });

  return () => {
    locked = true;
    const correctSet = new Set(lesson.correctSet);
    let correct = true;
    options.forEach((opt, i) => {
      opt.classList.add('locked');
      const isCorrect = correctSet.has(i);
      const isSelected = selected.has(i);
      if (isCorrect) opt.classList.add('correct');
      if (!isCorrect && isSelected) { opt.classList.add('wrong'); correct = false; }
      if (isCorrect && !isSelected) correct = false;
    });
    const correctText = lesson.correctSet.map(i => lesson.options[i]).join('; ');
    return { correct, detail: correct ? '' : `Правильные варианты: ${correctText}` };
  };
}

// ============================================================
//  ТИП 3: ПОРЯДОК
// ============================================================
function setupOrder(lesson, taskArea, checkBtn) {
  const shuffled = shuffle(lesson.items);
  let chain = [];
  let locked = false;

  taskArea.innerHTML = `
    <div class="order-chain" id="chain"></div>
    <div class="order-pool" id="pool"></div>
    <button class="btn btn-secondary" id="resetOrder" style="margin-top:8px; font-size:14px; padding:8px 16px;">↺ Начать заново</button>
  `;

  const chainEl = document.getElementById('chain');
  const poolEl = document.getElementById('pool');
  const resetBtn = document.getElementById('resetOrder');

  function draw() {
    chainEl.innerHTML = chain.map((idx, pos) =>
      `<div class="order-item in-chain"><span class="num">${pos + 1}</span>${escapeHtml(lesson.items[idx])}</div>`
    ).join('');
    poolEl.innerHTML = shuffled
      .filter(s => !chain.includes(s.i))
      .map(s => `<div class="order-item" data-idx="${s.i}">${escapeHtml(s.v)}</div>`)
      .join('');
    poolEl.querySelectorAll('.order-item').forEach(el => {
      el.addEventListener('click', () => {
        if (locked) return;
        chain.push(parseInt(el.dataset.idx));
        checkBtn.disabled = chain.length !== lesson.items.length;
        draw();
      });
    });
  }

  resetBtn.addEventListener('click', () => {
    if (locked) return;
    chain = [];
    checkBtn.disabled = true;
    draw();
  });

  draw();

  return () => {
    locked = true;
    resetBtn.style.display = 'none';
    let correct = true;
    chainEl.innerHTML = chain.map((idx, pos) => {
      const ok = lesson.correctOrder[pos] === idx;
      if (!ok) correct = false;
      return `<div class="order-item ${ok ? 'correct-chain' : 'wrong-chain'}"><span class="num">${pos + 1}</span>${escapeHtml(lesson.items[idx])}</div>`;
    }).join('');
    poolEl.innerHTML = '';
    return { correct, detail: correct ? '' : `Правильный порядок: ${lesson.correctOrder.map(i => lesson.items[i]).join(' → ')}` };
  };
}

// ============================================================
//  ТИП 4: СОПОСТАВЛЕНИЕ
// ============================================================
function setupMatch(lesson, taskArea, checkBtn) {
  const rightShuffled = shuffle(lesson.right);
  let activeLeft = null;
  let pairs = {};
  let locked = false;

  taskArea.innerHTML = `
    <div class="match-grid">
      <div class="match-col" id="leftCol"></div>
      <div class="match-col" id="rightCol"></div>
    </div>
  `;
  const leftCol = document.getElementById('leftCol');
  const rightCol = document.getElementById('rightCol');

  function draw() {
    leftCol.innerHTML = lesson.left.map((txt, i) => {
      const pairNum = pairs[i] !== undefined ? Object.keys(pairs).indexOf(String(i)) + 1 : null;
      const label = pairs[i] !== undefined ? `<span class="pair-label">${pairNum}</span>` : '';
      const cls = pairs[i] !== undefined ? 'matched' : (activeLeft === i ? 'active' : '');
      return `<div class="match-item ${cls}" data-side="left" data-idx="${i}">${label}${escapeHtml(txt)}</div>`;
    }).join('');

    rightCol.innerHTML = rightShuffled.map(s => {
      const matchedLeft = Object.keys(pairs).find(k => pairs[k] === s.i);
      const pairNum = matchedLeft !== undefined ? Object.keys(pairs).indexOf(matchedLeft) + 1 : null;
      const label = pairNum ? `<span class="pair-label">${pairNum}</span>` : '';
      const cls = pairNum ? 'matched' : '';
      return `<div class="match-item ${cls}" data-side="right" data-orig="${s.i}">${label}${escapeHtml(s.v)}</div>`;
    }).join('');

    leftCol.querySelectorAll('.match-item').forEach(el => {
      el.addEventListener('click', () => {
        if (locked || el.classList.contains('matched')) return;
        activeLeft = parseInt(el.dataset.idx);
        draw();
      });
    });
    rightCol.querySelectorAll('.match-item').forEach(el => {
      el.addEventListener('click', () => {
        if (locked || el.classList.contains('matched')) return;
        if (activeLeft === null) return;
        pairs[activeLeft] = parseInt(el.dataset.orig);
        activeLeft = null;
        checkBtn.disabled = Object.keys(pairs).length !== lesson.left.length;
        draw();
      });
    });
  }

  draw();

  return () => {
    locked = true;
    let correct = true;
    Object.keys(pairs).forEach(k => {
      const leftIdx = parseInt(k);
      const rightIdx = pairs[k];
      if (leftIdx !== rightIdx) correct = false;
    });

    leftCol.innerHTML = lesson.left.map((txt, i) => {
      const ok = pairs[i] === i;
      return `<div class="match-item ${ok ? 'correct-match' : 'wrong-match'}"><span class="pair-label">${ok ? '✓' : '✗'}</span>${escapeHtml(txt)}</div>`;
    }).join('');

    rightCol.innerHTML = rightShuffled.map(s => {
      const matchedLeft = Object.keys(pairs).find(k => pairs[k] === s.i);
      const ok = matchedLeft !== undefined && parseInt(matchedLeft) === s.i;
      return `<div class="match-item ${ok ? 'correct-match' : 'wrong-match'}">${escapeHtml(s.v)}</div>`;
    }).join('');

    return { correct, detail: correct ? '' : 'Некоторые пары составлены неверно. Правильные пары: ' + lesson.left.map((l, i) => `${l} → ${lesson.right[i]}`).join('; ') };
  };
}

// ============================================================
//  ПОКАЗ ОТВЕТА
// ============================================================
function showFeedback(feedbackEl, result, lesson) {
  const cls = result.correct ? 'success' : 'error';
  feedbackEl.className = 'feedback show ' + cls;
  feedbackEl.innerHTML = `
    <span class="fb-title">${result.correct ? '✅ Верно!' : '❌ Неверно'}</span>
    ${result.detail ? escapeHtml(result.detail) + '<br><br>' : ''}
    <b>Почему:</b> ${escapeHtml(lesson.explanation)}
  `;
}

// ============================================================
//  ИТОГОВЫЙ ТЕСТ (без кнопки "Назад")
// ============================================================
function renderFinalTest() {
  const progress = (LESSONS.length / (LESSONS.length + 1)) * 100;

  app.innerHTML = `
    <div class="card">
      <div class="module-meta">
        <span class="name-badge">👤 ${escapeHtml(state.studentName)}</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
      <h1>🎓 Итоговый тест</h1>
      <p class="subtitle">Все темы курса. Кнопка «Завершить» станет активной, когда вы ответите на все вопросы. Задания сохраняют свой тип (выбор, порядок, сопоставление, множественный выбор).</p>
      <div id="testArea"></div>
      <div class="actions">
        <button class="btn" id="submitTest" disabled>Завершить тест</button>
      </div>
    </div>`;

  const testArea = document.getElementById('testArea');
  const submitBtn = document.getElementById('submitTest');

  const testState = LESSONS.map((lesson, idx) => ({ idx, answered: false, result: null }));

  testArea.innerHTML = LESSONS.map((lesson, idx) => `
    <div style="margin-bottom:30px; padding-bottom:20px; border-bottom:1px solid #e2e8f0;" data-q="${idx}">
      <div class="review-question">${idx + 1}. ${escapeHtml(lesson.question)}</div>
      <div id="testTask${idx}"></div>
    </div>
  `).join('');

  LESSONS.forEach((lesson, idx) => {
    const container = document.getElementById(`testTask${idx}`);
    const onAnswer = () => {
      testState[idx].answered = true;
      submitBtn.disabled = !testState.every(t => t.answered);
    };

    if (lesson.type === 'single') {
      let selected = null;
      container.innerHTML = lesson.options.map((o, i) =>
        `<label class="option" data-index="${i}">${escapeHtml(o)}</label>`
      ).join('');
      const opts = container.querySelectorAll('.option');
      opts.forEach(opt => {
        opt.addEventListener('click', () => {
          opts.forEach(o => o.classList.remove('selected'));
          opt.classList.add('selected');
          selected = parseInt(opt.dataset.index);
          testState[idx].result = { correct: selected === lesson.correct };
          onAnswer();
        });
      });
    } else if (lesson.type === 'multi') {
      const sel = new Set();
      container.innerHTML = lesson.options.map((o, i) =>
        `<label class="option" data-index="${i}"><span class="check"></span>${escapeHtml(o)}</label>`
      ).join('');
      const opts = container.querySelectorAll('.option');
      opts.forEach(opt => {
        opt.addEventListener('click', () => {
          const i = parseInt(opt.dataset.index);
          if (sel.has(i)) { sel.delete(i); opt.classList.remove('selected'); }
          else { sel.add(i); opt.classList.add('selected'); }
          const correctSet = new Set(lesson.correctSet);
          let correct = sel.size === correctSet.size && [...sel].every(i => correctSet.has(i));
          testState[idx].result = { correct };
          testState[idx].answered = sel.size > 0;
          submitBtn.disabled = !testState.every(t => t.answered);
        });
      });
    } else if (lesson.type === 'order') {
      const shuffled = shuffle(lesson.items);
      let chain = [];
      container.innerHTML = `
        <div class="order-chain" id="fChain${idx}"></div>
        <div class="order-pool" id="fPool${idx}"></div>
      `;
      const chainEl = document.getElementById(`fChain${idx}`);
      const poolEl = document.getElementById(`fPool${idx}`);
      function drawF() {
        chainEl.innerHTML = chain.map((i, pos) =>
          `<div class="order-item in-chain"><span class="num">${pos + 1}</span>${escapeHtml(lesson.items[i])}</div>`
        ).join('');
        poolEl.innerHTML = shuffled.filter(s => !chain.includes(s.i))
          .map(s => `<div class="order-item" data-idx="${s.i}">${escapeHtml(s.v)}</div>`).join('');
        poolEl.querySelectorAll('.order-item').forEach(el => {
          el.addEventListener('click', () => {
            chain.push(parseInt(el.dataset.idx));
            if (chain.length === lesson.items.length) {
              let correct = chain.every((v, i) => v === lesson.correctOrder[i]);
              testState[idx].result = { correct };
              testState[idx].answered = true;
              submitBtn.disabled = !testState.every(t => t.answered);
            }
            drawF();
          });
        });
      }
      drawF();
    } else if (lesson.type === 'match') {
      const rightShuffled = shuffle(lesson.right);
      let pairs = {};
      let activeLeft = null;
      container.innerHTML = `
        <div class="match-grid">
          <div class="match-col" id="fL${idx}"></div>
          <div class="match-col" id="fR${idx}"></div>
        </div>
      `;
      const lCol = document.getElementById(`fL${idx}`);
      const rCol = document.getElementById(`fR${idx}`);
      function drawM() {
        lCol.innerHTML = lesson.left.map((txt, i) => {
          const matched = pairs[i] !== undefined;
          const num = matched ? Object.keys(pairs).indexOf(String(i)) + 1 : null;
          const label = matched ? `<span class="pair-label">${num}</span>` : '';
          return `<div class="match-item ${matched ? 'matched' : (activeLeft === i ? 'active' : '')}" data-side="left" data-idx="${i}">${label}${escapeHtml(txt)}</div>`;
        }).join('');
        rCol.innerHTML = rightShuffled.map(s => {
          const matched = Object.values(pairs).includes(s.i);
          const num = matched ? Object.keys(pairs).find(k => pairs[k] === s.i) : null;
          const label = matched ? `<span class="pair-label">${Object.keys(pairs).indexOf(num) + 1}</span>` : '';
          return `<div class="match-item ${matched ? 'matched' : ''}" data-side="right" data-orig="${s.i}">${label}${escapeHtml(s.v)}</div>`;
        }).join('');

        lCol.querySelectorAll('.match-item').forEach(el => {
          el.addEventListener('click', () => {
            if (el.classList.contains('matched')) return;
            activeLeft = parseInt(el.dataset.idx);
            drawM();
          });
        });
        rCol.querySelectorAll('.match-item').forEach(el => {
          el.addEventListener('click', () => {
            if (el.classList.contains('matched') || activeLeft === null) return;
            pairs[activeLeft] = parseInt(el.dataset.orig);
            activeLeft = null;
            if (Object.keys(pairs).length === lesson.left.length) {
              let correct = Object.keys(pairs).every(k => pairs[k] === parseInt(k));
              testState[idx].result = { correct };
              testState[idx].answered = true;
              submitBtn.disabled = !testState.every(t => t.answered);
            }
            drawM();
          });
        });
      }
      drawM();
    }
  });

  submitBtn.addEventListener('click', () => renderResults(testState));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ============================================================
//  РЕЗУЛЬТАТЫ
// ============================================================
function renderResults(testState) {
  let correctCount = 0;
  testState.forEach(t => { if (t.result && t.result.correct) correctCount++; });
  const total = LESSONS.length;
  const percent = Math.round((correctCount / total) * 100);

  const savedResults = JSON.parse(localStorage.getItem('dev_results') || '[]');
  savedResults.push({ name: state.studentName, score: correctCount, total, percent, date: new Date().toISOString() });
  localStorage.setItem('dev_results', JSON.stringify(savedResults));

  app.innerHTML = `
    <div class="card">
      <span class="name-badge">👤 ${escapeHtml(state.studentName)}</span>
      <div class="score-big">
        <div class="value">${percent}%</div>
        <div class="label">${correctCount} из ${total} правильных ответов</div>
      </div>
      <div class="results-grid">
        <div class="stat"><div class="stat-value">${correctCount}</div><div class="stat-label">Верно</div></div>
        <div class="stat"><div class="stat-value">${total - correctCount}</div><div class="stat-label">Ошибок</div></div>
        <div class="stat"><div class="stat-value">${total}</div><div class="stat-label">Всего заданий</div></div>
      </div>
      <h2>📋 Разбор ответов</h2>
      ${LESSONS.map((lesson, i) => {
        const ok = testState[i].result && testState[i].result.correct;
        return `
          <div class="review-item ${ok ? 'correct-item' : 'wrong-item'}">
            <div class="review-question">${ok ? '✅' : '❌'} ${i + 1}. ${escapeHtml(lesson.question)}</div>
            <div class="review-explain"><b>Пояснение:</b> ${escapeHtml(lesson.explanation)}</div>
          </div>`;
      }).join('')}
      <div class="actions">
        <button class="btn btn-secondary" id="restartBtn">Пройти заново</button>
      </div>
    </div>`;

  document.getElementById('restartBtn').addEventListener('click', () => {
    state.studentName = '';
    state.currentIndex = 0;
    state.answers = [];
    renderStart();
  });
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

renderStart();
</script>
